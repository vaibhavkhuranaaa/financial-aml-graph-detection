<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Signal Ledger architecture</title>
  <desc id="desc">A local checksum verified IBM AML-Data v8 transaction file feeds a typology rules engine, which emits an alert store. The alert store feeds an alert feature build and a backtest harness. The feature build feeds a learned ranker, which produces a ranked queue with evidence. The queue serves a local analyst workbench and a bounded public replay demo. The rules engine, alert store, feature build, backtest harness and learned ranker are built and run locally. The ranker beats every baseline rung and misses its ship gate, so it is measured and not promoted. The ranked queue and the analyst workbench are planned. The public demo is deployed.</desc>

  <rect width="940" height="470" fill="#10171c"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#edf2df">

    <!-- source -->
    <rect x="300" y="24" width="340" height="46" fill="#172126" stroke="#405059"/>
    <text x="470" y="44" text-anchor="middle">IBM AML-Data v8 transaction file</text>
    <text x="470" y="61" text-anchor="middle" fill="#405059" font-size="11">local, checksummed, never committed, never served</text>

    <!-- rules engine -->
    <rect x="300" y="104" width="340" height="46" fill="#172126" stroke="#405059"/>
    <text x="470" y="124" text-anchor="middle">typology rules engine  R1 to R8</text>
    <text x="470" y="141" text-anchor="middle" fill="#405059" font-size="11">parameterised to alert volume, base rates recorded</text>

    <!-- alert store -->
    <rect x="300" y="184" width="340" height="46" fill="#172126" stroke="#405059"/>
    <text x="470" y="204" text-anchor="middle">alert store</text>
    <text x="470" y="221" text-anchor="middle" fill="#405059" font-size="11">one row per alert, trigger evidence attached</text>

    <!-- feature build -->
    <rect x="60" y="264" width="300" height="46" fill="#172126" stroke="#405059"/>
    <text x="210" y="284" text-anchor="middle">alert feature build</text>
    <text x="210" y="301" text-anchor="middle" fill="#405059" font-size="11">pre decision cutoff, leakage gate</text>

    <!-- backtest -->
    <rect x="580" y="264" width="300" height="46" fill="#172126" stroke="#f38b4b"/>
    <text x="730" y="284" text-anchor="middle">backtest harness</text>
    <text x="730" y="301" text-anchor="middle" fill="#405059" font-size="11">B0 to B3, C1, per typology recall</text>

    <!-- ranker -->
    <rect x="60" y="332" width="300" height="40" fill="#172126" stroke="#405059"/>
    <text x="210" y="357" text-anchor="middle">learned ranker over alerts</text>

    <!-- queue -->
    <rect x="300" y="394" width="340" height="46" fill="#172126" stroke="#c6ee48"/>
    <text x="470" y="414" text-anchor="middle">ranked queue with evidence</text>
    <text x="470" y="431" text-anchor="middle" fill="#405059" font-size="11">capacity control states the hours it implies</text>

    <!-- surfaces -->
    <rect x="700" y="360" width="200" height="40" fill="#172126" stroke="#c6ee48"/>
    <text x="800" y="385" text-anchor="middle" font-size="12">analyst workbench</text>

    <rect x="700" y="410" width="200" height="40" fill="#172126" stroke="#405059"/>
    <text x="800" y="429" text-anchor="middle" font-size="12">public replay demo</text>
    <text x="800" y="444" text-anchor="middle" fill="#405059" font-size="10">deployed, bounded fixture</text>
  </g>

  <g stroke="#405059" stroke-width="1.5" fill="none">
    <path d="M470 70 L470 104"/>
    <path d="M470 150 L470 184"/>
    <path d="M470 230 L470 248 L210 248 L210 264"/>
    <path d="M470 230 L470 248 L730 248 L730 264"/>
    <path d="M210 310 L210 332"/>
    <path d="M210 372 L210 394 L300 394"/>
    <path d="M730 310 L730 326 L250 326" stroke-dasharray="4 4"/>
    <path d="M640 417 L700 430"/>
    <path d="M640 405 L700 380"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#405059">
    <text x="24" y="34">green border: planned</text>
    <text x="24" y="50">orange border: evaluation</text>
    <text x="24" y="66">grey border: exists today</text>
    <text x="256" y="322" fill="#f38b4b">promotes only if it beats rules only</text>
  </g>
</svg>
